# ---------------------------------------------------------------------------
# Minimal Mistakes theme
# Full option list: https://mmistakes.github.io/minimal-mistakes/docs/configuration/
# ---------------------------------------------------------------------------
remote_theme            : "mmistakes/minimal-mistakes@4.28.1"

# Skin options: air, aqua, catppuccin_latte, catppuccin_mocha, contrast, dark,
#               default, dirt, mint, neon, plum, sunrise
minimal_mistakes_skin   : "default"

# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
locale                  : "en-US"
title                   : "Hui Liu"
title_separator         : "-"
subtitle                : ""
name                    : "Hui Liu"
description             : "Machine learning engineer. Notes on robotics, generative models, and things I'm building."
url                     : "https://lhphanto.github.io"
baseurl                 : ""
repository              : "lhphanto/lhphanto.github.io"
teaser                  : # /assets/images/teaser.jpg — fallback teaser for posts
logo                    : # /assets/images/logo.png — small logo beside site title
masthead_title          : # overrides `title` in the masthead
breadcrumbs             : false
words_per_minute        : 200

# Site-wide comments (disqus, discourse, facebook, staticman, utterances, giscus)
comments:
  provider              : false

# Search
search                  : true
search_full_content     : false
search_provider         : lunr

# ---------------------------------------------------------------------------
# SEO / social
# ---------------------------------------------------------------------------
twitter:
  username              :
og_image                : # /assets/images/og-image.jpg — 1200x630 for link previews
social:
  type                  : Person
  name                  : Hui Liu
  links:
    - "https://github.com/lhphanto"

# ---------------------------------------------------------------------------
# Analytics (optional)
# ---------------------------------------------------------------------------
analytics:
  provider              : false

# ---------------------------------------------------------------------------
# Author — shown in the sidebar
# ---------------------------------------------------------------------------
author:
  name                  : "Hui Liu"
  avatar                : "/assets/images/author.avatar.jpg"
  bio                   : "Machine learning engineer working on vision models."
  location              : "Bay Area, CA"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lhphanto"
    # - label: "Email"
    #   icon: "fas fa-fw fa-envelope-square"
    #   url: "mailto:you@example.com"
    # - label: "LinkedIn"
    #   icon: "fab fa-fw fa-linkedin"
    #   url: "https://www.linkedin.com/in/your-handle/"

# ---------------------------------------------------------------------------
# Site footer
# ---------------------------------------------------------------------------
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lhphanto"

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
permalink               : /:categories/:title/
markdown                : kramdown
highlighter             : rouge
lsi                     : false
excerpt_separator       : "\n\n"
incremental             : false

include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - node_modules
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - log
  - tmp

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Pagination for the blog index
paginate                : 5
paginate_path           : /page:num/

timezone                : America/Los_Angeles

# ---------------------------------------------------------------------------
# Front-matter defaults
# ---------------------------------------------------------------------------
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
